# Nexus Sales + Nexus Support — staging / producción
#
# 1. Copiá .env.production.example → .env.production y completá secretos
# 2. docker compose --env-file .env.production up -d --build
# 3. Sales:    http://localhost:8080
#    Support:  http://localhost:8081  (equipo ops, no vendedores)

services:
  api:
    build:
      context: ./backend
    env_file:
      - .env.production
    environment:
      DATABASE_URL: sqlite:////app/data/nexus_sales.db
      NEXUS_FRONTEND_URL: ${NEXUS_FRONTEND_URL:-http://localhost:8080}
      NEXUS_CORS_ORIGINS: ${NEXUS_CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
    volumes:
      - nexus_data:/app/data
    ports:
      - "8002:8002"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: same
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  support:
    build:
      context: ./nexus-support
      dockerfile: Dockerfile
      args:
        VITE_API_URL: same
    ports:
      - "8081:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  nexus_data:
