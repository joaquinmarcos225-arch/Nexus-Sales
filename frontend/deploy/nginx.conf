server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API FastAPI (mismo origen → sin CORS)
    location ~ ^/(health|auth|onboarding|companies|campaigns|prospects|products|users|teams|credits|outreach|meetings|connections|gmail|google-calendar|lead-sourcing|analytics|crm|sequence-templates|integrations|support|notifications|extension|billing|webhooks)(/|$|\?) {
        proxy_pass http://api:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
